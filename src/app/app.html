<header class="app-header">
  <a class="brand" routerLink="/">DevTools</a>
  <button
    type="button"
    class="theme-toggle"
    (click)="theme.toggle()"
    [attr.aria-pressed]="theme.mode() === 'dark'">
    {{ theme.mode() === 'dark' ? 'Tema claro' : 'Tema escuro' }}
  </button>
</header>

<main class="app-main">
  <router-outlet />
</main>
